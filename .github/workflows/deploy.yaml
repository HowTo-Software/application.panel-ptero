name: Deploy

# master -> gate -> image on GHCR -> manual approval -> 192.168.1.210 (2htswebserver).
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image digest to deploy (skips build, e.g. sha256:...). Leave empty to build HEAD.'
        required: false
        default: ''

# Never let two deploys touch the host at once, and never cancel one mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Lowercase on purpose: registries reject uppercase paths, and github.repository
  # is HowTo-Software/howtoosoftware-panel-ptero.
  IMAGE: ghcr.io/howto-software/howtoosoftware-panel-ptero

jobs:
  checks:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.image_tag == '' }}
    permissions:
      contents: read
      # checks.yaml publishes its PHP toolchain image to GHCR. A called workflow can
      # never hold more than the calling job, so it has to be granted here too.
      packages: write
    uses: ./.github/workflows/checks.yaml

  build:
    name: Build and push
    needs: checks
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.image_tag == '' }}
    runs-on: [self-hosted, linux, X64, hts-panel]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=master,enable={{is_default_branch}}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: true
          # The panel host is x86_64; arm64 under QEMU costs minutes and ships nothing.
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published image before making it deployable
        run: docker run --rm --network none --entrypoint /bin/sh "${IMAGE}@${{ steps.push.outputs.digest }}" /app/.github/ci/verify-runtime.sh

      - id: ref
        name: Pin the deployable reference to a digest
        run: echo "image=${IMAGE}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Trim the local build cache
        # This builder now lives on the panel host; unbounded cache would fill its disk.
        if: always()
        run: docker buildx prune --force --filter until=168h

  deploy:
    name: Deploy to 2htswebserver
    needs: build
    # `always()` so a workflow_dispatch that skipped build still runs.
    if: ${{ always() && !cancelled() && (needs.build.result == 'success' || inputs.image_tag != '') }}
    runs-on: [self-hosted, linux, X64, hts-panel]
    timeout-minutes: 30
    environment:
      name: production
      url: https://panel.howto.software
    permissions:
      contents: read
      packages: read
    steps:
      # A full checkout on purpose - see the note in checks.yaml's toolchain job.
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Deploy
        env:
          PANEL_IMAGE: ${{ inputs.image_tag != '' && format('ghcr.io/howto-software/howtoosoftware-panel-ptero@{0}', inputs.image_tag) || needs.build.outputs.image }}
          GIT_SHA: ${{ github.sha }}
        run: |
          # Also guard workflow_dispatch references that intentionally skip build.
          # Do not invoke the image's migration/seed entrypoint for this check.
          docker run --rm --interactive --network none --entrypoint php "$PANEL_IMAGE" /dev/stdin < .github/ci/assert-php-version.php
          chmod +x deploy/deploy.sh
          deploy/deploy.sh "$PANEL_IMAGE"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
